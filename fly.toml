app = "btc-regime"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  CACHE_TTL_SECONDS = "3600"
  DATA_DIR = "/srv/data"
  # ALERT_ENABLED = "1"   # bat canh bao; dat TELEGRAM_BOT_TOKEN/CHAT_ID bang `fly secrets set`

# Tuy chon: giu lich su gia qua cac lan deploy. Tao volume truoc:
#   fly volumes create riskon_data --region sin --size 1
# roi bo comment 2 dong duoi.
# [mounts]
#   source = "riskon_data"
#   destination = "/srv/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "90s"
  method = "GET"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
